
plugins {
    id 'java'
}

repositories {
    mavenCentral()
}

dependencies {
    testImplementation 'org.junit.jupiter:junit-jupiter:5.10.0'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher:1.10.0'
}

test {
    useJUnitPlatform()
    testLogging {
        events "passed", "failed", "skipped"
        exceptionFormat "short"
    }
    afterSuite { desc, result ->
        if (!desc.parent) {
            println "\nTotal: ${result.testCount} | Passaram: ${result.successfulTestCount} | Falharam: ${result.failedTestCount} | Ignorados: ${result.skippedTestCount}"
        }
    }
}